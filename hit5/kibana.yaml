apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-scraper
  namespace: elastic
spec:
  version: 8.17.0 # Versión pinneada
  count: 1
  elasticsearchRef:
    name: elasticsearch-scraper
  podTemplate:
    spec:
      containers:
      - name: kibana
        resources:
          limits:
            memory: 1Gi # Límites de memoria para Kibana
          requests:
            memory: 1Gi