apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-scraper
  namespace: elastic
spec:
  version: 8.17.0 # Versión pinneada
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
      xpack.license.self_generated.type: basic
      xpack.security.enabled: true
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 2Gi
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g" # Heap de JVM fijado en 1Gi
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi # Espacio de almacenamiento para Elasticsearch
        storageClassName: local-path # Compatible con k3s